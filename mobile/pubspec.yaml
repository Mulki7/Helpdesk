publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
